services:
  postgres:
    image: postgres:16-alpine
    container_name: cityai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cityai
      POSTGRES_PASSWORD: cityai123
      POSTGRES_DB: cityai_db
    ports:
      - "5433:5432"
    volumes:
      - cityai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityai -d cityai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityai_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cityai_pg_data:
